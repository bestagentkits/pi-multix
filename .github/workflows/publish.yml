name: Publish Package

# Publishes to npm using trusted publishing (OIDC).
#
# There is no NPM_TOKEN secret anywhere in this repository. GitHub mints a
# short-lived OIDC token for this job, and the npm CLI exchanges it for a
# publish credential that is valid only for this workflow run. npm also
# generates provenance attestations automatically for a public package from a
# public repository, so `--provenance` must not be passed.
#
# Requirements, all of which must hold for a publish to succeed:
#   - A trusted publisher is configured on npmjs.com for this package with
#     organization `bestagentkits`, repository `pi-multix`, and workflow
#     filename `publish.yml` (filename only, and it must match exactly).
#   - That trusted publisher allows `npm publish`, not just `npm stage publish`.
#   - A cloud-hosted runner. Trusted publishing does not support self-hosted
#     runners.
#   - npm CLI >= 11.5.1 and Node >= 22.14.0.

on:
  push:
    tags:
      - "v*"

# id-token: write is what lets the job request an OIDC token from GitHub.
permissions:
  contents: read
  id-token: write

# Never let two publishes race; a partially overlapping publish would fail on an
# already-published version anyway.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Caching is deliberately off: a stale cache around publish is a
          # failure mode with no upside here.
          package-manager-cache: false

      - name: Check npm supports trusted publishing
        run: |
          set -eu
          REQUIRED="11.5.1"
          ACTUAL="$(npm --version)"
          echo "npm $ACTUAL (trusted publishing requires >= $REQUIRED)"
          node -e '
            const [required, actual] = process.argv.slice(1);
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number);
              const pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i += 1) {
                if ((pa[i] ?? 0) !== (pb[i] ?? 0)) return (pa[i] ?? 0) > (pb[i] ?? 0) ? 1 : -1;
              }
              return 0;
            };
            if (cmp(actual, required) < 0) {
              console.error("::error::npm " + actual + " is older than " + required + ", which trusted publishing requires.");
              process.exit(1);
            }
          ' "$REQUIRED" "$ACTUAL"

      - name: Check the tag matches package.json
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag v$TAG / package.json $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION. Refusing to publish a mismatched release."
            exit 1
          fi

      - run: npm ci

      # `npm publish` runs the package's own prepublishOnly gate, which is
      # `npm run verify`: typecheck, unit tests, build, and the loader
      # verification that loads the built bundle through pi's extension loader
      # and exercises the real CLI. A failure there aborts the publish before
      # anything is uploaded, so no release can ship untested.
      - name: Publish
        run: npm publish
